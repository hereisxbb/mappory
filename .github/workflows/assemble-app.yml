name: Assemble Mappory App source

on:
  push:
    paths:
      - '.github/workflows/assemble-app.yml'
      - '.app-parts/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild App.tsx
        shell: bash
        run: |
          set -euo pipefail
          cat .app-parts/part*.b64 | base64 --decode > App.tsx.gz
          gzip -t App.tsx.gz
          gzip -dc App.tsx.gz > App.tsx
          echo "ceea6298ff2ca140d2093458b4b49eef74b3ff4760ad771b054a7797db082b3f  App.tsx" | sha256sum -c -
          rm App.tsx.gz
          rm -rf .app-parts

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx .app-parts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add Mappory v0.6.8 application source"
          git push
