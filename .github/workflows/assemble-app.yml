name: Assemble Mappory App source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.title == 'assemble-mappory-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Rebuild App.tsx
        shell: bash
        run: |
          set -euo pipefail
          cat .app-parts/part*.b64 | base64 --decode > App.tsx.gz
          gzip -t App.tsx.gz
          gzip -dc App.tsx.gz > App.tsx
          echo "ceea6298ff2ca140d2093458b4b49eef74b3ff4760ad771b054a7797db082b3f  App.tsx" | sha256sum -c -
          rm App.tsx.gz
          rm -rf .app-parts
          rm -f .assembly-trigger

      - name: Commit reconstructed source to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Mappory v0.6.8 application source"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
